<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Task manager</p>
          <h1>Todo List</h1>
        </div>
        <button id="themeToggle" class="ghost-button" aria-label="Toggle theme">
          🌙
        </button>
      </header>

      <main class="layout">
        <section class="panel composer-panel">
          <form id="todoForm" class="todo-form">
            <div class="field-wrapper">
              <label for="taskInput">Task</label>
              <input
                id="taskInput"
                type="text"
                maxlength="200"
                placeholder="What needs to be done?"
                required
              />
            </div>

            <div class="inline-fields">
              <div class="field-wrapper">
                <label for="priorityInput">Priority</label>
                <select id="priorityInput">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </div>

              <div class="field-wrapper">
                <label for="dueDateInput">Due date</label>
                <input id="dueDateInput" type="date" />
              </div>
            </div>

            <div class="button-row">
              <button type="submit" class="primary-button">Add task</button>
              <button type="button" id="clearCompletedBtn" class="secondary-button">
                Clear completed
              </button>
            </div>
          </form>
        </section>

        <section class="panel list-panel">
          <div class="toolbar">
            <div class="filter-group" role="tablist" aria-label="Filter tasks">
              <button class="filter-button active" data-filter="all" type="button">All</button>
              <button class="filter-button" data-filter="active" type="button">Active</button>
              <button class="filter-button" data-filter="completed" type="button">Completed</button>
            </div>

            <div class="search-box">
              <input id="searchInput" type="search" placeholder="Search tasks" />
            </div>
          </div>

          <div class="summary-row">
            <span id="taskSummary">0 tasks</span>
            <span id="remainingSummary">0 remaining</span>
          </div>

          <ul id="taskList" class="task-list" aria-live="polite"></ul>
          <div id="emptyState" class="empty-state hidden">
            No tasks match your current filter.
          </div>
        </section>
      </main>
    </div>

    <template id="taskTemplate">
      <li class="task-item">
        <label class="task-main">
          <input class="task-checkbox" type="checkbox" />
          <span class="task-text"></span>
        </label>

        <div class="task-meta">
          <span class="task-priority"></span>
          <span class="task-date"></span>
        </div>

        <div class="task-actions">
          <button class="edit-button" type="button" aria-label="Edit task">Edit</button>
          <button class="delete-button" type="button" aria-label="Delete task">Delete</button>
        </div>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
